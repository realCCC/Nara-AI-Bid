# pgvector 청크 벡터 저장소 (VECTOR_STORE=pgvector). 실행: docker compose up -d
services:
  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_master
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_master"]
      interval: 5s
      retries: 10

volumes:
  pgvector_data:
